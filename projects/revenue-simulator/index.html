<html lang="ko"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIDC Revenue Simulator V2</title>
  <style>
    :root {
      /* Minimal Color Palette */
      --bg-body: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-surface: #ffffff;
      --bg-alt: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-soft: #94a3b8;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      
      /* Primary Theme: #ff6900 */
      --primary: #ff6900;
      --primary-hover: #e05800;
      --primary-soft: #fff4ed;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --danger: #ef4444;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      
      --font-sans: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--text-main);
      background: var(--bg-body);
      line-height: 1.5;
      height: 100vh;
      overflow: hidden; /* Prevent body scroll */
      display: flex;
      flex-direction: column;
    }
    button, input { font-family: inherit; }
    button { cursor: pointer; border: none; background: transparent; }

    /* ==================== GLOBAL HEADER ==================== */
    .app-header {
      flex: 0 0 60px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title::before {
      content: "";
      width: 12px; height: 12px;
      background: var(--primary);
      border-radius: 3px;
    }
    
    .view-tabs {
      display: flex;
      background: var(--bg-alt);
      padding: 4px;
      border-radius: var(--radius-sm);
    }
    .view-tab {
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 4px;
      transition: all 0.15s;
    }
    .view-tab.active {
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-scenario {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      transition: all 0.15s;
    }
    .btn-scenario:hover { border-color: var(--primary); color: var(--primary); }
    .btn-scenario.default { background: var(--text-main); color: #fff; border-color: var(--text-main); }
    .btn-scenario.default:hover { background: var(--primary); border-color: var(--primary); }
    
    .lang-toggle { display: flex; gap: 4px; border-left: 1px solid var(--border); padding-left: 12px; }
    .lang-btn {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      padding: 4px 8px; border-radius: 4px;
    }
    .lang-btn.active { color: var(--primary); background: var(--primary-soft); }

    /* ==================== APP LAYOUT ==================== */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ==================== SIDEBAR (CONTROLS) ==================== */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-alt);
    }
    .sidebar-header h2 { font-size: 14px; font-weight: 700; color: var(--text-main); }
    
    .controls-root {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .controls-root::-webkit-scrollbar { width: 6px; }
    .controls-root::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    
    .control-group { margin-bottom: 24px; }
    .control-group h3 {
      font-size: 12px; font-weight: 800; color: var(--text-soft);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
    }
    .control-item { margin-bottom: 16px; }
    .control-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .control-meta label { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .control-value { font-size: 12px; font-weight: 700; color: var(--primary); }
    
    input[type="number"] {
      width: 100%; height: 32px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--text-main);
    }
    input[type="number"]:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px var(--primary-soft); }
    input[type="range"] { width: 100%; accent-color: var(--primary); height: 4px; margin-top: 6px; }
    
    .segmented { display: flex; background: var(--bg-alt); padding: 3px; border-radius: var(--radius-sm); gap: 2px; }
    .segmented-btn { flex: 1; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--text-muted); border-radius: 4px; }
    .segmented-btn.active { background: var(--bg-surface); color: var(--primary); box-shadow: var(--shadow-sm); }
    
    .util-years { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .util-year-field { display: flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 6px; background: #fff;}
    .util-year-field input { border: none; height: 28px; padding: 0; text-align: right; box-shadow: none !important;}
    .util-year-label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-align: center; }
    .util-year-suffix { font-size: 12px; color: var(--text-soft); margin-left: 2px; }

    /* ==================== MAIN CONTENT ==================== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }
    .main-content::-webkit-scrollbar { width: 8px; }
    .main-content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    /* Summary Cards Grid */
    .summary-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
    }
    .summary-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-sm);
    }
    .summary-card .label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; display: block; }
    .summary-card .value { font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
    .summary-card .value.text-primary { color: var(--primary); }
    .summary-card .value.text-success { color: var(--success); }
    .summary-card .hint { font-size: 11px; color: var(--text-soft); }

    /* Clean Panels */
    .panel {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
    }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .panel-head h2 { font-size: 15px; font-weight: 700; color: var(--text-main); }
    .panel-head p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Chart Overrides */
    .chart-panel { padding-bottom: 12px; }
    .chart-wrap { position: relative; width: 100%; height: 220px; margin-top: 10px; }
    svg.chart { width: 100%; height: 100%; display: block; overflow: visible; }
    .axis, .gridline { stroke: var(--border); stroke-width: 1; }
    .gridline.zero { stroke: var(--border-strong); stroke-dasharray: 4 4; }
    .line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .line.revenue { stroke: var(--primary); }
    .line.expense { stroke: var(--text-soft); }
    .line.profit { stroke: var(--success); }
    .dot { stroke: #fff; stroke-width: 2; r: 4; }
    .dot.revenue { fill: var(--primary); }
    .dot.expense { fill: var(--text-soft); }
    .dot.profit { fill: var(--success); }
    .dot.hover-active { r: 6; }
    .hover-zone { fill: transparent; cursor: crosshair; }
    .hover-line { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
    .tick { fill: var(--text-soft); font-size: 11px; font-weight: 500; }
    .legend { display: flex; gap: 16px; justify-content: center; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .swatch { width: 10px; height: 10px; border-radius: 2px; }

    /* Tooltip */
    .chart-tooltip {
      position: absolute; top: 0; left: 0; z-index: 10;
      background: var(--text-main); color: #fff; padding: 10px 12px;
      border-radius: var(--radius-sm); font-size: 12px; box-shadow: var(--shadow-md);
      opacity: 0; pointer-events: none; transform: translate(-9999px, -9999px);
    }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip .tt-title { font-weight: 700; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; }
    .chart-tooltip .tt-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: rgba(255,255,255,0.8); }
    .chart-tooltip .tt-row b { margin-left: auto; color: #fff; font-weight: 600; }
    .chart-tooltip .tt-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Rack Selection (Compact Pills) */
    .rack-selector-list { display: flex; gap: 12px; }
    .rack-pill {
      flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md);
      background: var(--bg-surface); text-align: left; transition: all 0.15s;
    }
    .rack-pill:hover { border-color: var(--primary-soft); background: var(--bg-alt); }
    .rack-pill.active { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary); }
    .rack-pill strong { display: block; font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
    .rack-pill span { display: block; font-size: 11px; color: var(--text-muted); }

    /* Rack Adjust Compact Grid */
    .usage-strip {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-alt); padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 12px;
    }
    .usage-strip .meter-wrap { flex: 1; margin: 0 16px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .usage-strip .meter-fill { height: 100%; background: var(--primary); transition: width 0.3s; }
    
    .rack-adjust-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .rack-adjust-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; }
    .rack-adjust-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .rack-adjust-card-header strong { font-size: 13px; font-weight: 700; }
    .rack-count-control { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .rack-count-control input[type="number"] { width: 60px; height: 28px; text-align: center; }
    .spec-grid-compact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
    .spec-input-compact { display: flex; flex-direction: column; gap: 4px; }
    .spec-input-compact label { font-size: 10px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
    .spec-input-compact input { height: 26px; font-size: 11px; padding: 0 6px; }
    .spec-input-compact.full-width { grid-column: span 2; }
    .spec-input-compact.third-width { grid-column: span 1; }
    .spec-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; grid-column: span 2; }

    /* Tables */
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; text-align: right; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
    th { color: var(--text-muted); font-weight: 600; background: var(--bg-alt); }
    th:first-child, td:first-child { text-align: left; }
    td strong { font-weight: 600; color: var(--text-main); }
    tbody tr:hover { background: var(--bg-alt); }
    
    /* Basis List */
    .basis-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; list-style: none; }
    .basis-list li { background: var(--bg-alt); padding: 4px 10px; border-radius: 4px; font-size: 11px; display: flex; gap: 6px; border: 1px solid var(--border); }
    .basis-list .bl-key { color: var(--text-muted); }
    .basis-list .bl-val { font-weight: 600; color: var(--text-main); }

  </style>
</head>

      {
        titleKey: 'groupGpuTitle', views: ['gpu', 'compare'],
        controls: [{ id: 'fxKrwUsd', labelKey: 'labelFx', min: 1000, max: 1800, step: 10 }]
      },
      {
        titleKey: 'groupColoTitle', views: ['colo'],
        controls: [
          { id: 'colocationFeeKwMonth', labelKey: 'labelColoFee', min: 50000, max: 300000, step: 5000 },
          { id: 'electricSaleRate', labelKey: 'labelElectricSale', min: 80, max: 300, step: 0.1 }
        ]
      }
    ];

    let rackTypes = cloneRacks(RACK_DEFAULTS);
    let state = { ...DEFAULTS, racks_gb200: 0, racks_gb300: 0, racks_vr: 0 };

    const nf = new Intl.NumberFormat('en-US');
    const nf1 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });
    const nf2 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
    function t(key, vars) {
      let str = T[key] ? (T[key][state.lang] || T[key].ko) : key;
      if (vars) Object.keys(vars).forEach(k => { str = str.replace(`{${k}}`, vars[k]); });
      return str;
    }
    function cloneRacks(src) { return Object.fromEntries(Object.entries(src).map(([k, v]) => [k, { ...v }])); }
    function eok(value) {
      if(state.lang === 'en') return `$${nf1.format(Math.abs(value)/1500*1e8/1e6)}M`; // Simplified USD conversion
      return `${value < 0 ? '-' : ''}${Math.abs(value) >= 1000 ? nf.format(Math.round(Math.abs(value))) : nf1.format(Math.abs(value))}억`;
    }
    function usd(v) { return `$${nf.format(Math.round(v))}`; }
    function getPue() { return state.itPowerKw ? state.totalPowerKw / state.itPowerKw : 0; }
    function getCount(k) { return Number(state[RACK_COUNT_KEY[k]] || 0); }
    function setCount(k, v) { state[RACK_COUNT_KEY[k]] = Math.max(0, Math.floor(Number(v)||0)); }
    function calcUsedIt() { return RACK_KEYS.reduce((s, k) => s + getCount(k) * rackTypes[k].rackPowerKw, 0); }

    function fillSelectedRack(key = state.selectedRack) {
      state.selectedRack = key;
      RACK_KEYS.forEach(k => setCount(k, 0));
      setCount(key, Math.floor(state.itPowerKw / rackTypes[key].rackPowerKw));
    }
    
    function enforcePowerCap(changedKey = null) {
      const cap = state.itPowerKw;
      let total = calcUsedIt();
      if(total <= cap) return;
      const order = RACK_KEYS.filter(k => k !== changedKey).sort((a,b) => (a===state.selectedRack?1:0) - (b===state.selectedRack?1:0));
      if(changedKey) order.push(changedKey);
      order.forEach(k => {
        if(total <= cap) return;
        const c = getCount(k);
        if(c <= 0) return;
        const drop = Math.min(c, Math.ceil((total - cap) / rackTypes[k].rackPowerKw));
        setCount(k, c - drop);
        total = calcUsedIt();
      });
    }

    /* Core Calculation Math (Unchanged Logic, simplified functions for brevity) */
    function calcGpu() {
      const utils = [state.utilY1, state.utilY2, state.utilY3].map(v=>v/100);
      let itCapex = 0, usedIt = 0, gpu = 0, fp4 = 0;
      const revByY = [0,0,0];
      
      RACK_KEYS.forEach(k => {
        const r = rackTypes[k], c = getCount(k);
        for(let y=0;y<3;y++) revByY[y] += c * r.gpusPerRack * HOURS * r[['gpuHourlyRateY1','gpuHourlyRateY2','gpuHourlyRateY3'][y]] / EOK;
        itCapex += c * r.rackPriceUsd * state.fxKrwUsd / EOK;
        usedIt += c * r.rackPowerKw; gpu += c * r.gpusPerRack; fp4 += c * r.fp4Pflops;
      });

      const pue = getPue();
      const baseEok = state.totalPowerKw * state.basicChargeKwMonth * 12 / EOK;
      const energy100 = usedIt * pue * HOURS * state.energyCostRate / EOK;
      
      const annRev = utils.map((u,i) => revByY[i]*u);
      const annExp = utils.map((u,i) => (i===0 ? itCapex+state.facilityCapexEok : 0) + baseEok + energy100*u + state.opexEok);
      let sr=0, se=0;
      const cumRev = annRev.map(v=>sr+=v), cumExp = annExp.map(v=>se+=v), cumProf = cumRev.map((v,i)=>v-cumExp[i]);
      
      return { key: 'gpu', annRev, annExp, cumRev, cumExp, cumProf, allocPct: state.itPowerKw ? usedIt/state.itPowerKw*100 : 0, itCapex, usedIt };
    }

    function calcColo() {
      const utils = [state.utilY1, state.utilY2, state.utilY3].map(v=>v/100);
      const coloRev = state.itPowerKw * state.colocationFeeKwMonth * 12 / EOK;
      const elecRev100 = state.totalPowerKw * HOURS * state.electricSaleRate / EOK;
      const baseEok = state.totalPowerKw * state.basicChargeKwMonth * 12 / EOK;
      const energy100 = state.totalPowerKw * HOURS * state.energyCostRate / EOK;
      
      const annRev = utils.map(u => coloRev + elecRev100*u);
      const annExp = utils.map((u,i) => (i===0 ? state.facilityCapexEok : 0) + baseEok + energy100*u + state.opexEok);
      let sr=0, se=0;
      const cumRev = annRev.map(v=>sr+=v), cumExp = annExp.map(v=>se+=v), cumProf = cumRev.map((v,i)=>v-cumExp[i]);
      return { key: 'colo', annRev, annExp, cumRev, cumExp, cumProf, allocPct: 100 };
    }

    function getActiveData() { return state.activeView === 'colo' ? calcColo() : calcGpu(); }

    /* UI Rendering */
    function buildControls() {
      const root = document.getElementById('controlsRoot');
      root.innerHTML = controlGroups.map(g => `
        <section class="control-group" style="display: ${g.views.includes(state.activeView)?'block':'none'}">
          <h3>${t(g.titleKey)}</h3>
          ${g.controls.map(c => {
            if(c.type === 'utilYears') return `
              <div class="control-item">
                <div class="control-meta"><label>${t(c.labelKey||'labelUtilYears')}</label></div>
                <div class="util-years">
                  ${[1,2,3].map(y => `
                    <div class="util-year-field">
                      <span class="util-year-label">Y${y}</span>
                      <input type="number" data-input="utilY${y}" value="${state['utilY'+y]}" />
                      <span class="util-year-suffix">%</span>
                    </div>
                  `).join('')}
                </div>
              </div>`;
            if(c.type === 'segmented') return `
              <div class="control-item">
                <div class="control-meta"><label>${t(c.labelKey)}</label></div>
                <div class="segmented">
                  <button class="segmented-btn ${state.constructionType==='newbuild'?'active':''}" data-construction="newbuild">${t('newbuildBtn')}</button>
                  <button class="segmented-btn ${state.constructionType==='remodel'?'active':''}" data-construction="remodel">${t('remodelBtn')}</button>
                </div>
              </div>`;
            return `
              <div class="control-item">
                <div class="control-meta">
                  <label>${t(c.labelKey)}</label>
                  <span class="control-value">${c.id==='facilityCapexEok'||c.id==='opexEok' ? eok(state[c.id]) : nf.format(state[c.id])}</span>
                </div>
                <input type="range" data-input="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${state[c.id]}" />
              </div>
            `;
          }).join('')}
        </section>
      `).join('');
    }

    function renderCards(data) {
      const root = document.getElementById('summaryCards');
      const p = data.cumProf[2];
      root.innerHTML = `
        <div class="summary-card"><span class="label">${t('cardAnnualRevenue')}</span><div class="value text-primary">${eok(data.annRev[0])}</div></div>
        <div class="summary-card"><span class="label">${t('cardCumRevenue')}</span><div class="value">${eok(data.cumRev[2])}</div></div>
        <div class="summary-card"><span class="label">${t('cardCumExpense')}</span><div class="value">${eok(data.cumExp[2])}</div></div>
        <div class="summary-card"><span class="label">${t('cardCumProfit')}</span><div class="value ${p>=0?'text-success':'text-danger'}">${eok(p)}</div></div>
      `;
    }

    function renderChart(data) {
      const wrap = document.getElementById('chartWrap');
      if(!wrap) return;
      const w=860, h=220, p={l:80, r:20, t:20, b:24};
      const vals = [...data.cumRev, ...data.cumExp, ...data.cumProf, 0];
      let max = Math.max(...vals), min = Math.min(...vals);
      if(max===min){max+=10;min-=10;}
      const range = max-min; max+=range*0.1; min-=range*0.1;
      const x = i => p.l + i*((w-p.l-p.r)/2);
      const y = v => p.t + (max-v)*((h-p.t-p.b)/(max-min));
      
      let grid = '';
      for(let i=0;i<=4;i++){
        const yy = y(min+(max-min)*(i/4));
        grid += `<line class="gridline" x1="${p.l}" y1="${yy}" x2="${w-p.r}" y2="${yy}"></line><text class="tick" x="${p.l-8}" y="${yy+4}" text-anchor="end">${eok(min+(max-min)*(i/4))}</text>`;
      }
      const zy = y(0); if(zy>=p.t && zy<=h-p.b) grid += `<line class="gridline zero" x1="${p.l}" y1="${zy}" x2="${w-p.r}" y2="${zy}"></line>`;
      const xt = [0,1,2].map(i => `<text class="tick" x="${x(i)}" y="${h-4}" text-anchor="middle">${t('yearLabel',{n:i+1})}</text>`).join('');
      
      const s = [{d:data.cumRev,c:'revenue',col:'var(--primary)'},{d:data.cumExp,c:'expense',col:'var(--text-soft)'},{d:data.cumProf,c:'profit',col:'var(--success)'}];
      const paths = s.map(item => `<polyline class="line ${item.c}" points="${item.d.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"></polyline>${item.d.map((v,i)=>`<circle class="dot ${item.c}" cx="${x(i)}" cy="${y(v)}"></circle>`).join('')}`).join('');
      
      wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}">${grid}<line class="axis" x1="${p.l}" y1="${h-p.b}" x2="${w-p.r}" y2="${h-p.b}"></line><line class="axis" x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${h-p.b}"></line>${paths}${xt}</svg>`;
      document.getElementById('legend').innerHTML = s.map((item, i) => `<div class="legend-item"><div class="swatch" style="background:${item.col}"></div>${t(['legendRevenue','legendExpense','legendProfit'][i])}</div>`).join('');
    }

    function renderMainContent(data) {
      const mc = document.getElementById('mainContent');
      let html = '';
      if(state.activeView === 'gpu') {
        html += `
          <div class="panel">
            <div class="panel-head"><h2>${t('rackSelectorTitle')}</h2></div>
            <div class="rack-selector-list">
              ${RACK_KEYS.map(k => `
                <button class="rack-pill ${state.selectedRack===k?'active':''}" data-select-rack="${k}">
                  <strong>${rackTypes[k].shortLabel}</strong><span>${t('specPowerLabel')}: ${rackTypes[k].rackPowerKw}kW</span>
                </button>
              `).join('')}
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>${t('rackAdjustTitle')}</h2></div>
            <div class="usage-strip"><span>${t('usageLabel')}</span><div class="meter-wrap"><div class="meter-fill" style="width:${data.allocPct}%"></div></div><strong>${nf1.format(data.allocPct)}%</strong></div>
            <div class="rack-adjust-grid">
              ${RACK_KEYS.map(k => `
                <div class="rack-adjust-card">
                  <div class="rack-adjust-card-header"><strong>${rackTypes[k].shortLabel}</strong><div class="rack-count-control"><input type="number" data-rack-count="${k}" value="${getCount(k)}" min="0" /> EA</div></div>
                  <div class="spec-grid-compact">
                    <div class="spec-input-compact"><label>${t('specPriceUsdLabel')}</label><input type="number" data-rack-key="${k}" data-rack-prop="rackPriceUsd" value="${rackTypes[k].rackPriceUsd}" /></div>
                    <div class="spec-input-compact"><label>${t('specPowerKwLabel')}</label><input type="number" data-rack-key="${k}" data-rack-prop="rackPowerKw" value="${rackTypes[k].rackPowerKw}" /></div>
                    <div class="spec-row-3">
                      <div class="spec-input-compact"><label>${t('specHourlyY1Label')}</label><input type="number" data-rack-key="${k}" data-rack-prop="gpuHourlyRateY1" value="${rackTypes[k].gpuHourlyRateY1}" /></div>
                      <div class="spec-input-compact"><label>${t('specHourlyY2Label')}</label><input type="number" data-rack-key="${k}" data-rack-prop="gpuHourlyRateY2" value="${rackTypes[k].gpuHourlyRateY2}" /></div>
                      <div class="spec-input-compact"><label>${t('specHourlyY3Label')}</label><input type="number" data-rack-key="${k}" data-rack-prop="gpuHourlyRateY3" value="${rackTypes[k].gpuHourlyRateY3}" /></div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      
      html += `
        <div class="panel table-panel">
          <div class="panel-head"><h2>${t('tableTitle')}</h2></div>
          <div class="table-scroll">
            <table>
              <thead><tr><th>${t('colYear')}</th><th>${t('colAnnualRevenue')}</th><th>${t('colAnnualExpense')}</th><th>${t('colAnnualProfit')}</th><th>${t('colCumRevenue')}</th><th>${t('colCumExpense')}</th><th>${t('colCumProfit')}</th><th>${t('colMargin')}</th></tr></thead>
              <tbody>
                ${[0,1,2].map(i => {
                  const p = data.annRev[i]-data.annExp[i];
                  return `<tr><td><strong>${t('yearLabel',{n:i+1})}</strong></td><td>${eok(data.annRev[i])}</td><td>${eok(data.annExp[i])}</td><td class="${p>=0?'text-success':'text-danger'}">${eok(p)}</td><td>${eok(data.cumRev[i])}</td><td>${eok(data.cumExp[i])}</td><td class="${data.cumProf[i]>=0?'text-success':'text-danger'}"><strong>${eok(data.cumProf[i])}</strong></td><td>${data.annRev[i]?nf1.format(p/data.annRev[i]*100):0}%</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      mc.innerHTML = html;
    }

    function render() {
      document.getElementById('chartTitleText').textContent = t('chartTitle');
      document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view===state.activeView));
      buildControls();
      const data = getActiveData();
      renderCards(data);
      renderChart(data);
      renderMainContent(data);
    }

    document.addEventListener('input', e => {
      if(e.target.dataset.input) {
        state[e.target.dataset.input] = Number(e.target.value);
        if(e.target.dataset.input === 'itPowerKw') enforcePowerCap();
        render();
      }
      if(e.target.dataset.rackCount) {
        setCount(e.target.dataset.rackCount, e.target.value);
        state.selectedRack = e.target.dataset.rackCount;
        enforcePowerCap(e.target.dataset.rackCount);
        render();
      }
      if(e.target.dataset.rackProp) {
        rackTypes[e.target.dataset.rackKey][e.target.dataset.rackProp] = Number(e.target.value);
        render();
      }
    });

    document.addEventListener('click', e => {
      const v = e.target.closest('[data-view]'); if(v) { state.activeView = v.dataset.view; render(); }
      const l = e.target.closest('[data-lang]'); if(l) { state.lang = l.dataset.lang; document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b===l)); render(); }
      const r = e.target.closest('[data-select-rack]'); if(r) { fillSelectedRack(r.dataset.selectRack); render(); }
      const c = e.target.closest('[data-construction]'); if(c) { state.constructionType = c.dataset.construction; state.facilityCapexEok = c.dataset.construction==='newbuild'?350:270; render(); }
      const s = e.target.closest('[data-scenario]'); 
      if(s) { 
        const t = s.dataset.scenario;
        document.querySelectorAll('.btn-scenario').forEach(b=>b.classList.remove('default')); s.classList.add('default');
        if(t==='default') { state.utilY1=60; state.utilY2=90; state.utilY3=80; state.energyCostRate=121.7; state.colocationFeeKwMonth=130000; }
        if(t==='conservative') { state.utilY1=50; state.utilY2=80; state.utilY3=70; state.energyCostRate=140; state.colocationFeeKwMonth=115000; }
        if(t==='aggressive') { state.utilY1=70; state.utilY2=95; state.utilY3=90; state.energyCostRate=110; state.colocationFeeKwMonth=145000; }
        render();
      }
    });

    fillSelectedRack();
    render();
  </script>
</body>
</html>
